[package]
name = "hghub-core"
version = "1.2.1"
description = "HGhub 核心模块（无 Tauri 依赖）：业务 API、网络、媒体代理、会话、线路、诊断日志。桌面端与网页版共用。"
authors = ["HGhub"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"
rust-version = "1.90"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
# 注意：system-proxy 必须显式列出（见原 src-tauri/Cargo.toml 的说明）。
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "system-proxy",
  "gzip",
  "brotli",
  "json",
  "charset",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "fs"] }
aes = "0.8"
base64 = "0.22"
percent-encoding = "2"
once_cell = "1"
url = "2"
# 媒体代理的 Response 类型（原先用 tauri::http 转发同一个 http crate）。
http = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
